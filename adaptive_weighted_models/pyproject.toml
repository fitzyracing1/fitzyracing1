[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-weighted-models"
version = "0.1.0"
description = "Retrainable adaptive weighted model system with drift-aware auto-retraining"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Adaptive Weighted Models" }]
keywords = ["weighted-model", "ensemble", "drift-detection", "retraining", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/your-org/adaptive-weighted-models"
Repository = "https://github.com/your-org/adaptive-weighted-models"
Issues = "https://github.com/your-org/adaptive-weighted-models/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["weighted_models*"]
exclude = ["tests*", "examples*"]
