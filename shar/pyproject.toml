[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-feed-weighted-model"
version = "0.1.0"
description = "A weighted model for gravity-feed rate prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "EC" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gravity-feed = "gravity_feed_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
