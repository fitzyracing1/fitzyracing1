<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 2px; }
    .sub { color: #666; margin: 0 0 12px; }
    .row { margin: 5px 0; }
    label { display: inline-block; width: 120px; }
    input { width: 150px; padding: 3px 5px; }
    button { margin-top: 10px; padding: 6px 14px; cursor: pointer; }
    #out { margin-top: 12px; padding: 8px; background: #f2f4f7; border-radius: 6px;
           font-family: ui-monospace, monospace; font-size: 12px; min-height: 18px; word-break: break-all; }
    #out .k { color: #666; }
    #log { margin-top: 10px; max-height: 130px; overflow-y: auto; font-family: ui-monospace, monospace;
           font-size: 11px; color: #333; border-top: 1px solid #eee; padding-top: 6px; }
    #log div { padding: 1px 0; }
  </style>
</head>
<body>
  <h1>marev1 Miner (sandboxed WASM)</h1>
  <p class="sub">Your marev1 proof-of-work (src/block.rs) compiled to WebAssembly. Each run mines a block in a fresh, isolated Worker that is destroyed afterward.</p>

  <div class="row"><label for="index">Block index</label><input id="index" type="number" value="1"></div>
  <div class="row"><label for="timestamp">Timestamp</label><input id="timestamp" type="number" value="0"></div>
  <div class="row"><label for="prevSeed">Prev-hash seed</label><input id="prevSeed" type="number" value="3735928559"></div>
  <div class="row"><label for="difficulty">Difficulty (0s)</label><input id="difficulty" type="number" value="4" min="0" max="7"></div>
  <div class="row"><label for="maxIters">Max iterations</label><input id="maxIters" type="number" value="20000000"></div>

  <button id="run">Mine block in fresh sandbox</button>

  <div id="out">result appears here</div>
  <div id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
