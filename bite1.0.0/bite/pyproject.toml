[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-web-agent"
version = "0.1.0"
description = "Autonomous web agent with retrainable task profiles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "pydantic>=2.7.4",
  "tenacity>=8.3.0",
  "playwright>=1.47.0",
  "flask>=3.0.0",
]

[project.scripts]
agent-cli = "agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
